<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery - The Gallery Wall</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        header p {
            color: #888;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* The Main Gallery Wall Grid */
        .gallery-wall {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            padding: 20px;
        }

        /* Picture Card (Frame Maker's Core Deliverable) */
        .picture-card {
            background-color: #ffffff;
            color: #333333;
            padding: 15px 15px 20px 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .picture-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        /* Image Container inside the White Frame */
        .image-container {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #eaeaea;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .picture-card:hover .image-container img {
            transform: scale(1.05);
        }

        /* Simple Text Caption */
        .caption {
            font-size: 1rem;
            font-weight: 500;
            color: #444;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* Footer placeholder for team integration (Layer/Interactivity/State) */
        footer {
            margin-top: 50px;
            font-size: 0.85rem;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Artisan Gallery</h1>
        <p>The Gallery Wall &mdash; Frame Maker Layer</p>
    </header>

    <main class="gallery-wall" id="galleryWall">
        <!-- 4 to 6 Picture Cards with white borders and simple captions -->
        
        <div class="picture-card">
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" alt="Serene Coastline">
            </div>
            <div class="caption">Serene Coastline</div>
        </div>

        <div class="picture-card">
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=600&q=80" alt="Alpine Peaks">
            </div>
            <div class="caption">Alpine Peaks</div>
        </div>

        <div class="picture-card">
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1511497584788-876761192d12?auto=format&fit=crop&w=600&q=80" alt="Mystic Forest">
            </div>
            <div class="caption">Mystic Forest</div>
        </div>

        <div class="picture-card">
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=600&q=80" alt="Starlit Night">
            </div>
            <div class="caption">Starlit Night</div>
        </div>

        <div class="picture-card">
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=600&q=80" alt="Golden Meadow">
            </div>
            <div class="caption">Golden Meadow</div>
        </div>

    </main>

    <footer>
        Gallery Wall structural layout complete. Ready for upcoming behavior and interactivity layers.
    </footer>

</body>
</html>
